<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lite-rag</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>lite-rag</h1>
    <span class="version" id="version"></span>
  </header>

  <main id="chat">
    <div class="empty-state" id="empty-state">
      <div class="empty-title">lite-rag — ready</div>
      <div class="empty-hint">Ask anything about your indexed documents.<br />Answers are grounded in the indexed Markdown files.</div>
    </div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <span class="prompt-sign" aria-hidden="true">❯</span>
      <textarea
        id="query"
        placeholder="Type a question… (Enter to send, Shift+Enter for a new line)"
      ></textarea>
      <button id="submit" aria-label="Send" title="Send">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
