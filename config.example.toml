# lite-rag example configuration
# Copy this file to config.toml and adjust the values for your environment.
# All settings can also be overridden via environment variables (prefix: LITE_RAG_).

[api]
# Base URL of the OpenAI-compatible chat API endpoint (/chat/completions).
# Environment variable: LITE_RAG_API_BASE_URL
base_url = "http://localhost:1234/v1"

# API key sent in the Authorization header for chat requests.
# For LM Studio this can be any non-empty string.
# Environment variable: LITE_RAG_API_KEY
api_key  = "lm-studio"

# Base URL of the OpenAI-compatible embedding API endpoint (/embeddings).
# Set this when embeddings live on a different server from chat.
# Empty = fall back to base_url (backward compatible).
# Environment variable: LITE_RAG_API_EMBED_URL
embed_url = ""

# API key for embedding requests. Empty = fall back to api_key.
# Environment variable: LITE_RAG_API_EMBED_API_KEY
embed_api_key = ""

[models]
# Embedding model identifier as configured in LM Studio.
# Environment variable: LITE_RAG_EMBEDDING_MODEL
embedding = "nomic-ai/nomic-embed-text-v1.5-GGUF"

# Chat model identifier as configured in LM Studio.
# Environment variable: LITE_RAG_CHAT_MODEL
chat      = "openai/gpt-oss-20b"

[database]
# Path to the DuckDB database file.
# Environment variable: LITE_RAG_DB_PATH
path = "./lite-rag.db"

# How long a resident process (mcp, serve, ask) keeps its DuckDB handle open
# while idle before releasing the file lock. DuckDB lets only one process hold
# the file, so releasing the handle after a quiet period allows CLI commands
# (index, docs, ask) to use the same database without a lock conflict.
# 0 = keep the handle for the process lifetime (blocks the CLI).
# Environment variable: LITE_RAG_DB_IDLE_TIMEOUT_MS
idle_timeout_ms = 500

# How long any command waits for another process to release the lock before
# failing with an explanatory error.
# Environment variable: LITE_RAG_DB_LOCK_TIMEOUT_MS
lock_timeout_ms = 10000

[retrieval]
# Number of vector search hits to retrieve per query.
top_k = 5

# Fuse vector similarity with keyword matches (file path, heading, content) so a
# document whose name matches the query is not outranked by generic text that
# merely embeds nearby. Set false for pure vector search.
hybrid = true

# Vector and keyword candidates gathered per query before fusion truncates the
# list to top_k.
candidate_k = 50

# Strength of the keyword boost: score = cos + lexical_weight * lex * (1 - cos).
lexical_weight = 0.5

# Keyword match score (0..1) that admits a chunk whose cosine is below
# min_score. Path match = 0.8, heading = 0.6, content = 0.25.
lexical_min = 0.5

# Minimum cosine similarity for a hit to become a candidate passage.
# Queries unrelated to the corpus still land 0.55-0.71 on a topically tight
# index, so without this gate every question returns top_k candidates.
# 0 disables filtering. Retrieval scores alone cannot separate related-but-
# irrelevant from on-topic (the gap can be 0.005), so anything that survives
# this gate is judged by a cheap relevance check before an answer is generated.
min_score = 0.60

# Number of adjacent chunks (before and after each hit) to include for context.
# Set to 0 to return bare hit chunks without expansion.
context_window = 1

# Target token count per chunk. Mixed JP/EN token estimation is applied.
chunk_size = 512

# Token overlap between adjacent chunks to smooth chunk boundaries.
chunk_overlap = 64

# When true, the chat model rewrites the query into a declarative statement
# optimised for document retrieval, then runs a second vector search in parallel.
# Results from both searches are merged (max score per chunk) before context
# expansion. Increases recall at the cost of one extra LLM call per query.
query_rewrite = false

[server]
# Listen address for the `serve` subcommand (host:port).
# Bind to 127.0.0.1 to restrict access to localhost only (recommended).
# Can be overridden at runtime with: lite-rag serve --addr <host:port>
addr = "127.0.0.1:8080"

# Structured JSON log level written to stderr.
# "info"  — logs metadata only (passages count, score, latency). Query text is NOT logged.
# "debug" — also logs query text. Use only in development; queries may contain sensitive data.
# "warn"  — logs warnings and errors only.
# "error" — logs errors only.
log_level = "info"
